
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOGLO WISATA</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
      <nav class="navbar navbar-expand-lg sticky-top" style="background-color:orangered">
        <div class="container">
            <a class="navbar-brand text-white" href="#beranda">
            JOGLO WISATA 
            </a>
        </div>
    </nav>

    <section class="bg-dua">
            <img class="header-img" src="assets/header.png" alt="Header">
    </section>

    <section>
<div class="container">
        <div class="row justify-content-center align-items-center">



            <!-- FORM -->
            <div class="col-md-5">
                <div class="login-card p-4 shadow">
                    <h3 class="text-center mb-4">Register</h3>

                    <form id="form-box" onsubmit="return register()">
                        <div class="mb-3">
                            <label>Nama</label>
                            <input type="text" id="nama" class="form-control">
                        </div>



                         <div class="mb-3">
                            <label>Ponsel</label>
                            <input type="text" id="ponsel" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label>Password</label>
                            <input type="password" id="password" class="form-control">
                        </div>

                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-primary">Register</button>
                            <button type="reset" class="btn btn-secondary">Batal</button>
                        </div>

                        </form>
                        <p class="text-center mt-3">
                            <a href="login.html">Kembali</a>
                        </p>

                    </section>


                <script src="js/register.js"></script>

<footer class="text-py-4">
    <div class="container text-center">
        <p class="mb-1">&copy; JOGLO-WISATA2026</p>
    </div>
</footer>
